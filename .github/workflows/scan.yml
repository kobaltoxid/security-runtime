name: SecDepth reusable dependency scan

on:
  workflow_call:
    inputs:
      ecosystem:
        description: Source dependency ecosystem to scan (npm or go). Not used for release scans.
        required: false
        default: ""
        type: string
      release-artifact:
        description: Name of an artifact uploaded earlier in the calling run. Set it to scan a release build.
        required: false
        default: ""
        type: string
      release-file:
        description: Path of the release file inside release-artifact.
        required: false
        default: ""
        type: string
      stream:
        description: History stream. Defaults to branch-<branch> for source scans and release-<file name> for releases.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  scan:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ECOSYSTEM: ${{ inputs.ecosystem }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      ACTION_RUN_ID: ${{ github.run_id }}
      ACTION_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: target
          persist-credentials: false

      - name: Check out SecDepth
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kobaltoxid/secdepth
          ref: f371a9725cb17163d21b7390f3c5c1e811e6f005
          path: secdepth
          persist-credentials: false

      - name: Verify and run SecDepth
        shell: bash
        env:
          SECDEPTH_CACHE: ${{ runner.temp }}/secdepth-cache
        run: |
          set -euo pipefail
          mkdir -p "$SECDEPTH_CACHE" "$RUNNER_TEMP/secdepth-results"
          scan_log="$RUNNER_TEMP/secdepth-results/scan.log"
          : > "$scan_log"
          fail() {
            printf '%s\n' "ERROR: $1" >> "$scan_log"
            exit 1
          }
          case "$ECOSYSTEM" in
            npm|go) ;;
            *) fail "unsupported ecosystem: $ECOSYSTEM" ;;
          esac
          actual_sha="$(git -C target rev-parse HEAD 2>>"$scan_log")" || fail "could not read the target revision"
          test "$actual_sha" = "$PR_HEAD_SHA" || fail "target HEAD did not match the pull request head SHA"
          if test "$ECOSYSTEM" = npm; then
            test -f target/package.json && test ! -L target/package.json || fail "package.json is not a regular file"
            lockfile=""
            if test -e target/npm-shrinkwrap.json || test -L target/npm-shrinkwrap.json; then
              test -f target/npm-shrinkwrap.json && test ! -L target/npm-shrinkwrap.json || fail "npm-shrinkwrap.json is not a regular file"
              lockfile=target/npm-shrinkwrap.json
            elif test -e target/package-lock.json || test -L target/package-lock.json; then
              test -f target/package-lock.json && test ! -L target/package-lock.json || fail "package-lock.json is not a regular file"
              lockfile=target/package-lock.json
            fi
            test -n "$lockfile" || fail "no usable npm lockfile found"
          else
            test -f target/go.mod && test ! -L target/go.mod || fail "go.mod is not a regular file"
            test -f target/go.sum && test ! -L target/go.sum || fail "go.sum is not a regular file"
          fi
          python_bin="$(command -v python3)" || fail "Python 3 is unavailable"
          # SecDepth uses Git for revision metadata. Exclude package managers and build tools.
          scan_bin="$(mktemp -d "$RUNNER_TEMP/secdepth-bin.XXXXXX")"
          ln -s "$(command -v git)" "$scan_bin/git"
          PATH="$scan_bin" "$python_bin" -I secdepth/skills/secdepth/scripts/scan.py \
            "$GITHUB_WORKSPACE/target" \
            --output "$RUNNER_TEMP/secdepth-results" \
            >> "$scan_log" 2>&1

      - name: Write run metadata
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/secdepth-results"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          metadata = {
              "ecosystem": os.environ["ECOSYSTEM"],
              "pull_request": int(os.environ["PR_NUMBER"]),
              "head_sha": os.environ["PR_HEAD_SHA"],
              "run_id": int(os.environ["ACTION_RUN_ID"]),
              "run_attempt": int(os.environ["ACTION_RUN_ATTEMPT"]),
          }
          Path(os.environ["RUNNER_TEMP"], "secdepth-results", "run.json").write_text(
              json.dumps(metadata, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload SecDepth reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secdepth-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/secdepth-results
          if-no-files-found: error
          retention-days: 7

  history:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: secdepth-history-${{ github.repository }}-${{ inputs.stream != '' && inputs.stream || (inputs.release-file != '' && format('release-{0}', inputs.release-file) || github.ref_name) }}
      cancel-in-progress: false
    steps:
      - name: Check out the target commit
        if: ${{ inputs.release-file == '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: target
          persist-credentials: false

      - name: Download the release build
        if: ${{ inputs.release-file != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.release-artifact }}
          path: ${{ runner.temp }}/release-input

      - name: Check out security-runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: security-runtime
          persist-credentials: false

      - name: Check out SecDepth
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kobaltoxid/secdepth
          ref: f371a9725cb17163d21b7390f3c5c1e811e6f005
          path: secdepth
          persist-credentials: false

      - name: Check out secpeel
        if: ${{ inputs.release-file != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kobaltoxid/secpeel
          ref: 542c256ff386d6aa09f5bceeb21bc7823778ce5e
          path: secpeel
          persist-credentials: false

      - name: Resolve the scan event
        id: event
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ECOSYSTEM: ${{ inputs.ecosystem }}
          RELEASE_FILE: ${{ inputs.release-file }}
          STREAM: ${{ inputs.stream }}
        run: |
          set -euo pipefail
          args=(resolve --event "$EVENT_NAME" --stream "$STREAM" --github-output "$GITHUB_OUTPUT")
          if test -n "$RELEASE_FILE"; then
            args+=(--release-dir "$RUNNER_TEMP/release-input" --release-file "$RELEASE_FILE")
          else
            args+=(--source target --sha "$COMMIT_SHA" --ref-name "$REF_NAME" --ecosystem "$ECOSYSTEM")
          fi
          python3 security-runtime/.github/scripts/scan_event.py "${args[@]}"

      - name: Restore stream history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/secdepth-state
          key: secdepth-state-${{ steps.event.outputs.stream }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: secdepth-state-${{ steps.event.outputs.stream }}-

      - name: Run the scan
        id: scan
        shell: bash
        env:
          STATE: ${{ runner.temp }}/secdepth-state
          TARGET: ${{ steps.event.outputs.target }}
          STREAM: ${{ steps.event.outputs.stream }}
          TRIGGER: ${{ steps.event.outputs.trigger }}
          REVISION: ${{ steps.event.outputs.revision }}
        run: |
          set -euo pipefail
          python_bin="$(command -v python3)"
          # Expose Git and secpeel's read-only unpack and analysis tools. Exclude package managers and build tools.
          scan_bin="$(mktemp -d "$RUNNER_TEMP/secdepth-bin.XXXXXX")"
          for tool in git 7z zstd nm java unblob; do
            if tool_path="$(command -v "$tool")"; then
              ln -s "$tool_path" "$scan_bin/$tool"
            fi
          done
          status=0
          PATH="$scan_bin" "$python_bin" -E -s security-runtime/main.py scan "$TARGET" \
            --state "$STATE" --stream "$STREAM" --trigger "$TRIGGER" --revision "$REVISION" \
            > "$RUNNER_TEMP/runtime-summary.json" || status=$?
          cat "$RUNNER_TEMP/runtime-summary.json"
          python3 security-runtime/.github/scripts/scan_event.py summarize "$RUNNER_TEMP/runtime-summary.json" \
            --state "$STATE" --github-output "$GITHUB_OUTPUT" --step-summary "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Save stream history
        if: ${{ always() && steps.scan.outputs.run_id != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/secdepth-state
          key: secdepth-state-${{ steps.event.outputs.stream }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload SecDepth reports
        if: ${{ always() && steps.scan.outputs.run_dir != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secdepth-${{ steps.event.outputs.stream }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.scan.outputs.run_dir }}
          if-no-files-found: error
          retention-days: 30
