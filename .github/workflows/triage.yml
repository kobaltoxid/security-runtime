name: Hosted SecDepth triage pilot

on:
  workflow_call:
    inputs:
      finding:
        description: Advisory ID to review. Empty selects the first flagged finding.
        required: false
        type: string
      verify_only:
        description: Run scan, artifact handoff, and CLI installation without model access.
        required: false
        default: false
        type: boolean
      scan_run_id:
        description: Successful PR scan run ID to triage
        required: true
        type: string
      require_opt_in:
        description: Require the secdepth-triage label on the source PR.
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      finding:
        description: Advisory ID to review. Empty selects the first flagged finding.
        required: false
        type: string
      verify_only:
        description: Run scan, artifact handoff, and CLI installation without model access.
        required: false
        default: false
        type: boolean
      scan_run_id:
        description: Successful bg-cars-discord-bot PR scan run ID to triage
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hosted-triage-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET_SHA: c4ba0863b53eb49dc2daf3f7ca959f3ef47e757b
  SECDEPTH_SHA: f371a9725cb17163d21b7390f3c5c1e811e6f005
  PR_SCAN_RUN_ID: ${{ inputs.scan_run_id }}
  REQUIRE_OPT_IN: ${{ inputs.require_opt_in }}

jobs:
  scan:
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      actions: read
    outputs:
      has_findings: ${{ steps.findings.outputs.has_findings }}
      receipt_name: ${{ steps.pr_handoff.outputs.receipt_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out security-runtime for PR handoff
        if: ${{ inputs.scan_run_id != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download and verify PR scan handoff
        id: pr_handoff
        if: ${{ inputs.scan_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PR_SCAN_RUN_ID" = "${PR_SCAN_RUN_ID//[^0-9]/}" || {
            printf '%s\n' 'scan_run_id must contain only digits' >&2
            exit 1
          }
          args=(
            --run-id "$PR_SCAN_RUN_ID"
            --output-dir "$RUNNER_TEMP/secdepth-handoff"
          )
          if test "$REQUIRE_OPT_IN" = true; then
            args+=(--require-opt-in --github-output "$GITHUB_OUTPUT")
          fi
          python3 .github/scripts/pr_scan_input.py "${args[@]}"

      - name: Check out target snapshot
        if: ${{ inputs.scan_run_id == '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kobaltoxid/bg-cars-discord-bot
          ref: ${{ env.TARGET_SHA }}
          path: target
          persist-credentials: false

      - name: Check out SecDepth
        if: ${{ inputs.scan_run_id == '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kobaltoxid/secdepth
          ref: ${{ env.SECDEPTH_SHA }}
          path: secdepth
          persist-credentials: false

      - name: Scan target snapshot
        if: ${{ inputs.scan_run_id == '' }}
        shell: bash
        env:
          SECDEPTH_CACHE: ${{ runner.temp }}/secdepth-cache
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/secdepth-output"
          handoff="$RUNNER_TEMP/secdepth-handoff"
          mkdir -p "$output" "$handoff" "$SECDEPTH_CACHE"
          scan_log="$output/scan.log"
          : > "$scan_log"
          fail() {
            printf '%s\n' "ERROR: $1" >> "$scan_log"
            exit 1
          }
          actual_sha="$(git -C target rev-parse HEAD 2>>"$scan_log")" || fail "could not read target revision"
          test "$actual_sha" = "$TARGET_SHA" || fail "target revision did not match the pinned snapshot"
          test -f target/go.mod && test ! -L target/go.mod || fail "go.mod is not a regular file"
          test -f target/go.sum && test ! -L target/go.sum || fail "go.sum is not a regular file"
          python_bin="$(command -v python3)" || fail "Python 3 is unavailable"
          scan_bin="$(mktemp -d "$RUNNER_TEMP/secdepth-bin.XXXXXX")"
          ln -s "$(command -v git)" "$scan_bin/git"
          PATH="$scan_bin" "$python_bin" -I secdepth/skills/secdepth/scripts/scan.py \
            "$GITHUB_WORKSPACE/target" --output "$output" >> "$scan_log" 2>&1
          test -s "$output/report.json" || fail "report.json was not created"
          test -s "$output/checks.json" || fail "checks.json was not created"
          cp "$output/report.json" "$handoff/report.json"
          cp "$output/checks.json" "$handoff/checks.json"

      - name: Detect flagged findings
        id: findings
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/secdepth-handoff/report.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import pathlib
          import sys
          report = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          findings = report.get("vulnerabilities")
          if not isinstance(findings, list):
              raise SystemExit("report has no vulnerabilities list")
          flagged = any(
              isinstance(item, dict)
              and isinstance(item.get("review"), dict)
              and item["review"].get("needed") is True
              for item in findings
          )
          with pathlib.Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              output.write(f"has_findings={'true' if flagged else 'false'}\n")
          PY

      - name: Upload triage input
        if: ${{ success() && (steps.pr_handoff.outputs.receipt_name == '' || steps.findings.outputs.has_findings == 'true') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triage-input-${{ github.run_id }}
          path: ${{ runner.temp }}/secdepth-handoff
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Upload clean opt-in receipt
        if: ${{ success() && steps.pr_handoff.outputs.receipt_name != '' && steps.findings.outputs.has_findings == 'false' && !inputs.verify_only }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.pr_handoff.outputs.receipt_name }}
          path: ${{ runner.temp }}/secdepth-handoff/source.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Upload scan diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triage-scan-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/secdepth-output
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  triage:
    if: ${{ github.ref == 'refs/heads/main' && needs.scan.result == 'success' && (!inputs.require_opt_in || needs.scan.outputs.has_findings == 'true') }}
    needs: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: triage
    steps:
      - name: Check out security-runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download triage input
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: triage-input-${{ github.run_id }}
          path: ${{ runner.temp }}/triage-input

      - name: Record scan provenance
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/triage-input/source.json"
          if test -f "$source"; then
            {
              printf '%s\n' '### Scan provenance' '```json'
              cat "$source"
              printf '%s\n' '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install pinned Claude Code CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/claude-code" --no-audit --no-fund \
            @anthropic-ai/claude-code@2.1.330
          printf '%s\n' "$RUNNER_TEMP/claude-code/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Verify installed Claude Code CLI
        shell: bash
        run: claude --version

      - name: Run resumable triage
        if: ${{ !inputs.verify_only && needs.scan.outputs.has_findings == 'true' }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TRIAGE_FINDING: ${{ inputs.finding }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLAUDE_CODE_OAUTH_TOKEN"
          input="$RUNNER_TEMP/triage-input"
          db="$RUNNER_TEMP/triage.sqlite3"
          args=("$input" --db "$db" --provider claude-oauth --model haiku)
          if test -n "$TRIAGE_FINDING"; then
            args+=(--finding "$TRIAGE_FINDING")
          fi
          python3 triage.py "${args[@]}" --step > "$RUNNER_TEMP/triage-checkpoint.json"
          python3 triage.py "${args[@]}" > "$RUNNER_TEMP/triage-verdict.json"

      - name: Upload triage verdict
        if: ${{ success() && !inputs.verify_only && needs.scan.outputs.has_findings == 'true' && needs.scan.outputs.receipt_name != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.scan.outputs.receipt_name }}
          path: |
            ${{ runner.temp }}/triage-checkpoint.json
            ${{ runner.temp }}/triage-verdict.json
            ${{ runner.temp }}/triage.sqlite3
            ${{ runner.temp }}/triage-input/source.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Upload triage diagnostics
        if: ${{ always() && !inputs.verify_only && needs.scan.outputs.has_findings == 'true' && (needs.scan.outputs.receipt_name == '' || failure()) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triage-verdict-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/triage-checkpoint.json
            ${{ runner.temp }}/triage-verdict.json
            ${{ runner.temp }}/triage.sqlite3
            ${{ runner.temp }}/triage-input/source.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
