name: Hosted SecDepth triage pilot

on:
  workflow_dispatch:
    inputs:
      finding:
        description: Advisory ID to review. Empty selects the first flagged finding.
        required: false
        type: string
      verify_only:
        description: Run scan, artifact handoff, and CLI installation without model access.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: hosted-triage-${{ github.ref }}
  cancel-in-progress: false

env:
  TARGET_SHA: c4ba0863b53eb49dc2daf3f7ca959f3ef47e757b
  SECDEPTH_SHA: f371a9725cb17163d21b7390f3c5c1e811e6f005

jobs:
  scan:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out target snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kobaltoxid/bg-cars-discord-bot
          ref: ${{ env.TARGET_SHA }}
          path: target
          persist-credentials: false

      - name: Check out SecDepth
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kobaltoxid/secdepth
          ref: ${{ env.SECDEPTH_SHA }}
          path: secdepth
          persist-credentials: false

      - name: Scan target snapshot
        shell: bash
        env:
          SECDEPTH_CACHE: ${{ runner.temp }}/secdepth-cache
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/secdepth-output"
          handoff="$RUNNER_TEMP/secdepth-handoff"
          mkdir -p "$output" "$handoff" "$SECDEPTH_CACHE"
          scan_log="$output/scan.log"
          : > "$scan_log"
          fail() {
            printf '%s\n' "ERROR: $1" >> "$scan_log"
            exit 1
          }
          actual_sha="$(git -C target rev-parse HEAD 2>>"$scan_log")" || fail "could not read target revision"
          test "$actual_sha" = "$TARGET_SHA" || fail "target revision did not match the pinned snapshot"
          test -f target/go.mod && test ! -L target/go.mod || fail "go.mod is not a regular file"
          test -f target/go.sum && test ! -L target/go.sum || fail "go.sum is not a regular file"
          python_bin="$(command -v python3)" || fail "Python 3 is unavailable"
          scan_bin="$(mktemp -d "$RUNNER_TEMP/secdepth-bin.XXXXXX")"
          ln -s "$(command -v git)" "$scan_bin/git"
          PATH="$scan_bin" "$python_bin" -I secdepth/skills/secdepth/scripts/scan.py \
            "$GITHUB_WORKSPACE/target" --output "$output" >> "$scan_log" 2>&1
          test -s "$output/report.json" || fail "report.json was not created"
          test -s "$output/checks.json" || fail "checks.json was not created"
          cp "$output/report.json" "$handoff/report.json"
          cp "$output/checks.json" "$handoff/checks.json"

      - name: Upload triage input
        if: ${{ success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triage-input-${{ github.run_id }}
          path: ${{ runner.temp }}/secdepth-handoff
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Upload scan diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triage-scan-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/secdepth-output
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  triage:
    if: ${{ github.ref == 'refs/heads/main' && needs.scan.result == 'success' }}
    needs: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: triage
    steps:
      - name: Check out security-runtime
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download triage input
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: triage-input-${{ github.run_id }}
          path: ${{ runner.temp }}/triage-input

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install pinned Claude Code CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/claude-code" --no-audit --no-fund \
            @anthropic-ai/claude-code@2.1.330
          printf '%s\n' "$RUNNER_TEMP/claude-code/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Verify installed Claude Code CLI
        shell: bash
        run: claude --version

      - name: Run resumable triage
        if: ${{ !inputs.verify_only }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TRIAGE_FINDING: ${{ inputs.finding }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLAUDE_CODE_OAUTH_TOKEN"
          input="$RUNNER_TEMP/triage-input"
          db="$RUNNER_TEMP/triage.sqlite3"
          args=("$input" --db "$db" --provider claude-oauth --model haiku)
          if test -n "$TRIAGE_FINDING"; then
            args+=(--finding "$TRIAGE_FINDING")
          fi
          python3 triage.py "${args[@]}" --step > "$RUNNER_TEMP/triage-checkpoint.json"
          python3 triage.py "${args[@]}" > "$RUNNER_TEMP/triage-verdict.json"

      - name: Upload triage verdict
        if: ${{ always() && !inputs.verify_only }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triage-verdict-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/triage-checkpoint.json
            ${{ runner.temp }}/triage-verdict.json
            ${{ runner.temp }}/triage.sqlite3
          if-no-files-found: error
          overwrite: true
          retention-days: 7
